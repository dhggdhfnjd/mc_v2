<script id="farm-logic">
// farm-logic.js — content of <script id="farm-logic">.  Assigns window.FarmLogic.
// PURE: no DOM, no Date.now(), no timers, no randomness (except makePrng with an explicit seed), no structuredClone.
// Must load inside tests/lib.mjs loadLogic() sandbox (only window.FarmData from <script id="farm-data"> is visible).
// CONVENTIONS
//   money  = integer MINOR units of the pack currency (NGN: naira, minorPerMajor=1; INR: paise, minorPerMajor=100)
//   weight = integer GRAMS       price = integer minor units PER KG       time = epoch milliseconds (number)
//   rounding = half away from zero (roundDiv); every division of money/weight goes through roundDiv/roundToStep
//   every function taking `pack` accepts a pack id string ('ng-kano') or a pack object
//   functions that can fail because of user input return {ok:false, error:'CODE'} — they never throw
window.FarmLogic = (function () {

      var sh3 = dealSheet(p, st2, ctx.sheetCtx); if (!sh3.ok) return fail(sh3.error, offer0);
      offer.state = 'ACCEPTED'; offer.ver += 1;
      offer.deal = { terms: st2, sheet: sh3, issuedAt: now, deadline: now + N.sheetTtlHours * HOUR, acceptedBy: 'SYS', confirm: { S: false, B: false } };
      offer.history.push({ turn: offer.turn, by: 'SYS', action: 'SEALED_DEAL', terms: st2, at: now, ver: offer.ver });
      return ok(offer, { type: 'SEALED_DEAL', from: from, to: 'ACCEPTED', by: 'SYS', turn: offer.turn }, [{ type: 'RESERVE_STOCK', grams: st2.grams }]);
    }
    if (cmd.type === 'ACCEPT') {
      if (st !== 'AWAIT_SELLER' && st !== 'AWAIT_BUYER') return fail('ILLEGAL_STATE', offer0);
      if (awaited(st) !== cmd.by) return fail('NOT_YOUR_TURN', offer0);
      var t = offer.proposal.terms;
      if (ctx.remainingGrams != null && t.grams > ctx.remainingGrams) return fail('OVER_STOCK', offer0);
      var sh = dealSheet(p, t, ctx.sheetCtx); if (!sh.ok) return fail(sh.error, offer0);
      if (sh.readbackRequired) { if (cmd.last2 == null) return fail('READBACK_REQUIRED', offer0); if (String(cmd.last2) !== sh.lastTwo) return fail('READBACK_MISMATCH', offer0); }
      offer.state = 'ACCEPTED'; offer.ver += 1;
      offer.deal = { terms: t, sheet: sh, issuedAt: now, deadline: now + N.sheetTtlHours * HOUR, acceptedBy: cmd.by, confirm: { S: false, B: false } };
      offer.deal.confirm[cmd.by] = true;
      offer.history.push({ turn: offer.turn, by: cmd.by, action: 'ACCEPT', at: now, ver: offer.ver });
      return ok(offer, { type: 'ACCEPT', from: from, to: 'ACCEPTED', by: cmd.by, turn: offer.turn }, [{ type: 'RESERVE_STOCK', grams: t.grams }]);
    }
    if (cmd.type === 'CONFIRM') {
      if (st !== 'ACCEPTED') return fail('ILLEGAL_STATE', offer0);
      if (offer.deal.confirm[cmd.by]) return fail('ALREADY_CONFIRMED', offer0);
      var sh2 = offer.deal.sheet;
      if (sh2.readbackRequired) { if (cmd.last2 == null) return fail('READBACK_REQUIRED', offer0); if (String(cmd.last2) !== sh2.lastTwo) return fail('READBACK_MISMATCH', offer0); }
      offer.deal.confirm[cmd.by] = true; offer.ver += 1;
      offer.state = 'DEALT';
      offer.history.push({ turn: offer.turn, by: cmd.by, action: 'CONFIRM', at: now, ver: offer.ver });
      return ok(offer, { type: 'CONFIRM', from: from, to: 'DEALT', by: cmd.by, turn: offer.turn }, [{ type: 'RECORD_TRADE', terms: offer.deal.terms, sheet: sh2 }]);
    }
    if (cmd.type === 'DECLINE') {
      var effects = [];
      if (st === 'ACCEPTED') { if (offer.deal.confirm[cmd.by]) return fail('ILLEGAL_STATE', offer0); effects.push({ type: 'RELEASE_STOCK', grams: offer.deal.terms.grams }); }
      else if (st !== 'AWAIT_SELLER' && st !== 'AWAIT_BUYER') return fail('ILLEGAL_STATE', offer0);
      var lp = lastPrices(offer), sp = lp.S != null ? lp.S : ctx.askMinorPerKg, bp = lp.B;
      offer.gapBand = (sp != null && bp != null) ? gapBand(p, sp, bp) : null;
      offer.state = 'DECLINED'; offer.declineBy = cmd.by; offer.ver += 1;
      offer.history.push({ turn: offer.turn, by: cmd.by, action: 'DECLINE', at: now, ver: offer.ver });
      return ok(offer, { type: 'DECLINE', from: from, to: 'DECLINED', by: cmd.by, turn: offer.turn }, effects);
    }
    if (cmd.type === 'REOPEN') {
      if (st !== 'EXPIRED') return fail('ILLEGAL_STATE', offer0);

      if (ctx.listingOpen === false) return fail('LISTING_CLOSED', offer0);
      var eff = [];
      if (offer.expiredReason === 'sheet') {
        if (ctx.remainingGrams != null && offer.deal.terms.grams > ctx.remainingGrams) return fail('OVER_STOCK', offer0);
        offer.state = 'ACCEPTED'; offer.deal.deadline = now + N.sheetTtlHours * HOUR; eff.push({ type: 'RESERVE_STOCK', grams: offer.deal.terms.grams });
      } else { offer.state = offer.prevState; offer.proposal.respondBy = now + ctx.respondMs; }
      offer.reopens += 1; offer.ver += 1; offer.expiredReason = null;
      offer.history.push({ turn: offer.turn, by: cmd.by, action: 'REOPEN', at: now, ver: offer.ver });
      return ok(offer, { type: 'REOPEN', from: from, to: offer.state, by: cmd.by, turn: offer.turn }, eff);
    }

  }
  // run several commands in order; each step sees the previous offer; failed steps leave the offer unchanged
  function applySequence(offer0, cmds, ctx) {
    var offer = offer0, steps = [];
    cmds.forEach(function (cmd) {
      var c = clone(cmd); if (offer && c.baseVer == null) c.baseVer = offer.ver;
      var r = applyAction(offer, c, ctx);
      if (r.ok) { offer = r.offer; steps.push({ ok: true, type: cmd.type, by: cmd.by, state: offer.state, turn: offer.turn, ver: offer.ver, final: offer.proposal ? offer.proposal.final : false, effects: r.effects.map(function (e) { return e.type; }) }); }
      else steps.push({ ok: false, type: cmd.type, by: cmd.by, error: r.error, state: offer ? offer.state : null });
    });
    return { steps: steps, final: offer ? { state: offer.state, turn: offer.turn, ver: offer.ver, price: offer.proposal ? offer.proposal.terms.priceMinorPerKg : null, gapBand: offer.gapBand, reopens: offer.reopens } : null };
  }

  // ------------------------------------------------------------------ sealed bargaining & blind weighing
  function blindResolve(pack, o) { // o {floor, ceiling, round?}
    var p = P(pack), B = p.negotiation.blind, step = p.currency.priceStep;
    if (!isInt(o.floor) || !isInt(o.ceiling) || o.floor < 1 || o.ceiling < 1) return err('BAD_PRICE');
    if (o.ceiling >= o.floor) {
      var mid = roundDiv(o.floor + o.ceiling, 2), snapped = roundToStep(mid, step, 'nearest');
      return { ok: true, deal: true, priceMinorPerKg: Math.min(o.ceiling, Math.max(o.floor, snapped)), midRaw: mid };
    }
    var g = gapBand(p, o.floor, o.ceiling);
    return { ok: true, deal: false, gapBps: g.gapBps, level: g.level, canReseal: g.level === 'small' && (o.round || 1) < B.maxRounds };
  }
  function resealBounds(pack, o) { // o {role, prev}: concession is allowed only toward the other side, at most resealMaxConcedeBps
    var c = P(pack).negotiation.blind.resealMaxConcedeBps;
    return o.role === 'S' ? { min: ceilDiv(o.prev * (10000 - c), 10000), max: o.prev } : { min: o.prev, max: Math.floor(o.prev * (10000 + c) / 10000) };
  }
  function sealedGuard(pack, value, refMid) {
    var far = P(pack).negotiation.blind.farFromBandBps;
    if (!isInt(refMid) || refMid <= 0) return { far: false };
    var d = roundDiv(Math.abs(value - refMid) * 10000, refMid);
    return { far: d > far, deviationBps: d };
  }
  function weighCompare(pack, o) { // o {a, b, priceMinorPerKg}
    var W = P(pack).negotiation.weigh;
    if (!isInt(o.a) || !isInt(o.b) || o.a <= 0 || o.b <= 0) return err('BAD_GRAMS');
    var avg = roundDiv(o.a + o.b, 2), diff = Math.abs(o.a - o.b), bps = roundDiv(diff * 10000, avg);
    var level = bps <= W.greenBps ? 'green' : bps <= W.yellowBps ? 'yellow' : 'red';
    return { ok: true, level: level, diffGrams: diff, diffBps: bps, agreedGrams: level === 'red' ? null : avg, diffMinor: roundDiv(diff * (o.priceMinorPerKg || 0), 1000) };
  }

  // ------------------------------------------------------------------ reputation, phrases, misc
  function reputationView(pack, s) { // s {deals, weighChecks, weighOk, onTime, ghosts}
    var minN = P(pack).negotiation.reputationMinN;
    if (!s || s.deals < minN) return { kind: 'new', n: s ? s.deals : 0 };
    var lvl = function (pct) { return pct >= 90 ? 'full' : pct >= 70 ? 'half' : 'empty'; };
    var wp = s.weighChecks > 0 ? roundDiv(s.weighOk * 100, s.weighChecks) : null, tp = roundDiv(s.onTime * 100, s.deals), kp = roundDiv((s.deals - s.ghosts) * 100, s.deals);
    return { kind: 'ok', n: s.deals, dots: [{ key: 'weigh', pct: wp, level: wp == null ? 'na' : lvl(wp) }, { key: 'time', pct: tp, level: lvl(tp) }, { key: 'kept', pct: kp, level: lvl(kp) }] };
  }
  function phrasesFor(pack, role, turn) { // ids of phrases the side may attach at this point (P09 only once a final price is possible)
    var N = P(pack).negotiation;
    return window.FarmData.phrases.filter(function (ph) {
      if (ph.roles.indexOf(role) < 0) return false;
      if (ph.needs === 'final' && turn + 1 < N.finalFromTurn) return false;
      return true;
    }).map(function (ph) { return ph.id; });
  }
  function renderPhrase(id, lang) {
    var ph = null, list = window.FarmData.phrases;
    for (var i = 0; i < list.length; i++) if (list[i].id === id) ph = list[i];
    if (ph) return ph[lang] || ph.en;
    var n = Number(String(id).replace(/\D/g, '')) || 0;
    return lang === 'zh' ? '#' + n + '（更新後可見）' : '#' + n + ' (update to view)';
  }
  function phraseRefCheck(pack, o) { // P05 "elsewhere is better": o {role, priceMinorPerKg, exitMinor, freshness}
    if (o.exitMinor == null || o.freshness === 'stale' || o.freshness === 'none' || o.freshness === 'old') return 'stale';
    var supported = o.role === 'B' ? o.exitMinor < o.priceMinorPerKg : o.exitMinor > o.priceMinorPerKg;
    return supported ? 'supports' : 'unsupported';
  }
  function knockAllowed(pack, o) { // o {times:[epoch ms of knocks today's window], now, lastKnockVer, offerVer}
    var max = P(pack).negotiation.smsPerThreadPerDay, recent = (o.times || []).filter(function (t) { return o.now - t < DAY; }).length;
    if (o.lastKnockVer != null && o.lastKnockVer === o.offerVer) return { ok: false, reason: 'SAME_STATE' };
    if (recent >= max) return { ok: false, reason: 'DAILY_LIMIT' };
    return { ok: true, remaining: max - recent - 1 };
  }
  function makePrng(seed) { // mulberry32; used by MockServer for seeded flakiness / bot jitter
    var a = seed >>> 0;
    return function () { a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  }
  function respondMsFor(pack, cropId) { var p = P(pack), c = getCrop(p, cropId); return p.negotiation.respondMinutesByClass[c.perishClass] * 60000; }
  function leaseMs(pack, cropId) { return getCrop(P(pack), cropId).leaseHours * HOUR; }

  return {
    // basics / format
    roundDiv: roundDiv, roundToStep: roundToStep, fmtMoney: fmtMoney, fmtKg: fmtKg, fmtClock: fmtClock, agoParts: agoParts, fmtTpl: fmtTpl,
    cellWidth: cellWidth, truncateCells: truncateCells, viewLint: viewLint,
    // codes & input
    luhnCheckDigit: luhnCheckDigit, makeListingCode: makeListingCode, verifyListingCode: verifyListingCode, dealCode: dealCode, parseDealCode: parseDealCode,
    bufferPush: bufferPush, bufferValue: bufferValue,
    // units & money
    containerGrams: containerGrams, toGrams: toGrams, perKgFromPerContainer: perKgFromPerContainer, perContainerFromPerKg: perContainerFromPerKg, unitMismatch: unitMismatch,
    lineTotal: lineTotal, makeChange: makeChange, feeOf: feeOf, feeCliff: feeCliff,
    distanceKm: distanceKm, freightMinor: freightMinor, freightPerKg: freightPerKg, lossBps: lossBps, gradeAdjust: gradeAdjust, normalizeToGradeA: normalizeToGradeA,
    dealSheet: dealSheet, basket: basket,
    // reference price
    externalPrice: externalPrice, freshnessOf: freshnessOf, displayPrice: displayPrice, weightedQuantile: weightedQuantile, referencePrice: referencePrice,
    // guards / coach
    magnitudeGuard: magnitudeGuard, detectUnitSlip: detectUnitSlip, quoteVerdict: quoteVerdict, exitPriceSeller: exitPriceSeller, exitPriceBuyer: exitPriceBuyer,
    defaultLimits: defaultLimits, openingLadder: openingLadder, suggestCounter: suggestCounter,
    // matching
    visibleTo: visibleTo, rankListings: rankListings, rankWants: rankWants, rankOfOffer: rankOfOffer,
    // negotiation
    changedFields: changedFields, gapBand: gapBand, isDue: isDue, expireIfDue: expireIfDue, applyAction: applyAction, applySequence: applySequence, lastPrices: lastPrices,
    // sealed / weigh
    blindResolve: blindResolve, resealBounds: resealBounds, sealedGuard: sealedGuard, weighCompare: weighCompare,
    // misc
    reputationView: reputationView, phrasesFor: phrasesFor, renderPhrase: renderPhrase, phraseRefCheck: phraseRefCheck, knockAllowed: knockAllowed,
    makePrng: makePrng, respondMsFor: respondMsFor, leaseMs: leaseMs,
    CONST: { MAX_GRAMS: MAX_GRAMS, MAX_PRICE: MAX_PRICE, TERM_FIELDS: TERM_FIELDS, HOUR: HOUR, DAY: DAY },
  };
})();
